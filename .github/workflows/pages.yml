name: 앱 사이트 자동 배포

# main에 변경이 올라오면 새 버전을 공개합니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장한 파일 가져오기
        uses: actions/checkout@v4
      - name: 공개 사이트 준비
        uses: actions/configure-pages@v5
      - name: 앱 파일 모으기
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 새 버전 공개
        id: deployment
        uses: actions/deploy-pages@v4
